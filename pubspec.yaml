name: alogyan_prep
description: "Alogyan Prep — Competitive Exam Preparation App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Design Core Icons ──────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Enterprise State Management ───────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Firebase Cloud Infrastructure ─────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Required to auto-generate code compilation blocks for the Riverpod structure
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  # ── Custom Premium Typography ──────────────────────────────────────────────
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  # ── Project Directory Static Asset Setup ───────────────────────────────────
  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/